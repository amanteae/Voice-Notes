<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聽寫 · 中文語音辨識</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eae3d3;
    --paper-deep: #ded4bd;
    --ink: #21201c;
    --ink-soft: #55524a;
    --seal: #a8341f;
    --seal-soft: rgba(168,52,31,0.14);
    --bamboo: #3f5d46;
    --line: rgba(33,32,28,0.14);
    --radius: 2px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(255,255,255,0.5), transparent 45%),
      radial-gradient(ellipse at 90% 110%, rgba(0,0,0,0.05), transparent 50%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
  }

  /* subtle paper fiber texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.012) 0px, transparent 1px, transparent 3px);
  }

  .page{
    width:100%;
    max-width:720px;
    position:relative;
  }

  header{
    text-align:center;
    margin-bottom:8px;
  }

  .eyebrow{
    font-family:'Noto Sans Mono', monospace;
    font-size:12px;
    letter-spacing:0.32em;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin:0 0 14px;
  }

  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(34px, 6vw, 52px);
    margin:0;
    letter-spacing:0.04em;
    line-height:1.15;
  }

  h1 .accent{
    color:var(--seal);
  }

  .sub{
    font-size:14.5px;
    color:var(--ink-soft);
    margin:16px auto 0;
    max-width:440px;
    line-height:1.8;
  }

  /* ---------- mic stage ---------- */
  .stage{
    margin:52px auto 36px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .mic-wrap{
    position:relative;
    width:220px;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ripple{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--seal);
    opacity:0;
  }
  .ripple.active{
    animation:ripple-out 2.6s ease-out infinite;
  }
  .ripple.r2.active{ animation-delay:0.9s; }
  .ripple.r3.active{ animation-delay:1.8s; }

  @keyframes ripple-out{
    0%{ transform:scale(0.55); opacity:0.55; }
    100%{ transform:scale(1.25); opacity:0; }
  }

  .mic-btn{
    position:relative;
    z-index:2;
    width:130px;
    height:130px;
    border-radius:50%;
    border:1.5px solid var(--ink);
    background:var(--paper);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.35s ease, border-color 0.35s ease, transform 0.15s ease;
    box-shadow:0 1px 0 rgba(0,0,0,0.05);
  }
  .mic-btn:hover{ transform:translateY(-1px); }
  .mic-btn:active{ transform:translateY(0px) scale(0.98); }

  .mic-btn.listening{
    background:var(--ink);
    border-color:var(--ink);
  }

  .mic-btn svg{
    width:40px;
    height:40px;
    stroke:var(--ink);
    fill:none;
    stroke-width:1.6;
    transition:stroke 0.35s ease;
  }
  .mic-btn.listening svg{ stroke:var(--paper); }

  /* waveform bars inside/around button when listening */
  .bars{
    position:absolute;
    bottom:-38px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:24px;
  }
  .bars span{
    width:3px;
    background:var(--seal);
    border-radius:2px;
    height:4px;
    opacity:0.35;
    transition:opacity 0.3s ease;
  }
  .bars.active span{
    opacity:1;
    animation:bar-bounce 1.1s ease-in-out infinite;
  }
  .bars span:nth-child(1){ animation-delay:0s; }
  .bars span:nth-child(2){ animation-delay:0.12s; }
  .bars span:nth-child(3){ animation-delay:0.24s; }
  .bars span:nth-child(4){ animation-delay:0.36s; }
  .bars span:nth-child(5){ animation-delay:0.48s; }
  .bars span:nth-child(6){ animation-delay:0.36s; }
  .bars span:nth-child(7){ animation-delay:0.24s; }
  .bars span:nth-child(8){ animation-delay:0.12s; }
  .bars span:nth-child(9){ animation-delay:0s; }

  @keyframes bar-bounce{
    0%, 100%{ height:4px; }
    50%{ height:22px; }
  }

  .status{
    margin-top:52px;
    font-family:'Noto Sans Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .status .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--ink-soft);
  }
  .status.on .dot{
    background:var(--seal);
    box-shadow:0 0 0 3px var(--seal-soft);
  }
  .status.on{ color:var(--seal); }

  /* ---------- transcript scroll ---------- */
  .scroll{
    margin-top:44px;
    background:linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.15));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 30px 26px;
    position:relative;
    min-height:220px;
  }
  .scroll::before{
    content:"逐字稿";
    position:absolute;
    top:-11px;
    left:24px;
    background:var(--paper);
    padding:0 10px;
    font-family:'Noto Sans Mono', monospace;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--ink-soft);
  }

  .transcript{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    line-height:2.15;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
    min-height:120px;
  }
  .transcript .interim{
    color:var(--ink-soft);
    font-style:normal;
    border-bottom:1px dashed var(--ink-soft);
  }
  .transcript:empty::before,
  .transcript.empty::before{
    content:"點擊上方麥克風開始說話，文字會即時出現在這裡。";
    color:#9a9585;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14.5px;
  }

  .toolbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }

  .btn-ghost{
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 16px;
    cursor:pointer;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .btn-ghost:hover{
    border-color:var(--ink-soft);
    color:var(--ink);
  }

  .lang-row{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:34px;
    flex-wrap:wrap;
  }
  .lang-pill{
    font-family:'Noto Sans Mono', monospace;
    font-size:12px;
    letter-spacing:0.04em;
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .lang-pill.active{
    border-color:var(--bamboo);
    color:var(--bamboo);
    background:rgba(63,93,70,0.08);
  }

  .error-box{
    display:none;
    margin-top:24px;
    border:1px solid var(--seal);
    background:var(--seal-soft);
    color:var(--seal);
    padding:14px 18px;
    border-radius:var(--radius);
    font-size:13.5px;
    line-height:1.7;
  }
  .error-box.show{ display:block; }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:12px;
    color:#a29c8c;
    letter-spacing:0.02em;
  }

  @media (max-width:480px){
    .mic-wrap{ width:180px; height:180px; }
    .mic-btn{ width:108px; height:108px; }
    .scroll{ padding:26px 18px 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    .ripple.active, .bars.active span{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="eyebrow">WEB SPEECH · 即時聽寫</p>
    <h1>聽<span class="accent">寫</span></h1>
    <p class="sub">按下麥克風開始說話，語音將即時轉換成文字，如同落筆成書。</p>
  </header>

  <div class="stage">
    <div class="mic-wrap">
      <div class="ripple r1"></div>
      <div class="ripple r2"></div>
      <div class="ripple r3"></div>
      <button class="mic-btn" id="micBtn" aria-label="開始或停止語音辨識">
        <svg id="micIcon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <div class="bars" id="bars">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <p class="status" id="status"><span class="dot"></span><span id="statusText">尚未開始</span></p>
  </div>

  <div class="lang-row">
    <button class="lang-pill active" data-lang="zh-TW">繁體中文（台灣）</button>
    <button class="lang-pill" data-lang="zh-CN">簡體中文</button>
    <button class="lang-pill" data-lang="zh-HK">粵語（香港）</button>
    <button class="lang-pill" data-lang="en-US">English</button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="scroll">
    <div class="transcript empty" id="transcript"></div>
    <div class="toolbar">
      <button class="btn-ghost" id="copyBtn">複製文字</button>
      <button class="btn-ghost" id="clearBtn">清空</button>
    </div>
  </div>

  <footer>語音辨識由瀏覽器內建引擎提供，音訊不會上傳到本頁伺服器。iOS 請用 Safari 14.5 以上版本，並透過 https 網址開啟本頁。</footer>
</div>

<script>
(function(){
  const micBtn = document.getElementById('micBtn');
  const bars = document.getElementById('bars');
  const statusWrap = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const transcriptEl = document.getElementById('transcript');
  const errorBox = document.getElementById('errorBox');
  const copyBtn = document.getElementById('copyBtn');
  const clearBtn = document.getElementById('clearBtn');
  const ripples = document.querySelectorAll('.ripple');
  const langPills = document.querySelectorAll('.lang-pill');

  let currentLang = 'zh-TW';
  let finalText = '';
  let listening = false;      // 使用者是否「想要」持續聆聽（按了麥克風、還沒按停止）
  let recognizing = false;    // 目前這個 recognition 實例是否正在跑
  let recognition = null;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // 偵測 iOS（含 iPadOS 桌面模式）與是否為安全連線
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError(){
    errorBox.classList.remove('show');
  }

  if(!isSecure){
    showError('這個頁面目前不是用 HTTPS 開啟的。iOS Safari 必須在安全連線（https://）或 localhost 底下才能使用麥克風，請把這個檔案放到網頁空間（例如 GitHub Pages）後再用 https 網址開啟。');
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
    micBtn.style.cursor = 'not-allowed';
  } else if(!SpeechRecognition){
    showError('這個瀏覽器不支援語音辨識功能（Web Speech API）。請改用 Safari 14.5 以上版本、或電腦版 Chrome / Edge 瀏覽器開啟本頁。');
    micBtn.disabled = true;
    micBtn.style.opacity = '0.4';
    micBtn.style.cursor = 'not-allowed';
  } else {
    setupRecognition();
  }

  function setupRecognition(){
    recognition = new SpeechRecognition();
    recognition.lang = currentLang;
    // iOS Safari 的 continuous 模式有已知 bug（麥克風卡住、收不到結果），
    // 這裡改用「單句偵測 + 自動重啟」來模擬連續聆聽，所有瀏覽器都適用。
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = function(){
      recognizing = true;
      hideError();
      micBtn.classList.add('listening');
      bars.classList.add('active');
      ripples.forEach(r => r.classList.add('active'));
      statusWrap.classList.add('on');
      statusText.textContent = '聆聽中…';
    };

    recognition.onend = function(){
      recognizing = false;
      // 如果使用者還沒按停止，就自動重啟，做出「持續聆聽」的效果
      if(listening){
        try{
          recognition.start();
        } catch(err){
          listening = false;
          resetUI();
        }
      } else {
        resetUI();
      }
    };

    recognition.onerror = function(e){
      let msg = '';
      if(e.error === 'not-allowed' || e.error === 'permission-denied'){
        msg = '無法取得麥克風權限，請到「設定 → Safari → 麥克風」允許存取後再試一次。';
        listening = false;
      } else if(e.error === 'no-speech'){
        // 沒聽到聲音很常見，交給 onend 自動重啟即可，不用打斷使用者
        return;
      } else if(e.error === 'network'){
        msg = '網路連線異常，語音辨識暫時無法使用。';
      } else if(e.error === 'aborted'){
        return;
      } else {
        msg = '發生錯誤：' + e.error;
      }
      if(msg) showError(msg);
    };

    recognition.onresult = function(event){
      let interim = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const result = event.results[i];
        if(result.isFinal){
          finalText += result[0].transcript;
        } else {
          interim += result[0].transcript;
        }
      }
      renderTranscript(interim);
    };
  }

  function resetUI(){
    micBtn.classList.remove('listening');
    bars.classList.remove('active');
    ripples.forEach(r => r.classList.remove('active'));
    statusWrap.classList.remove('on');
    statusText.textContent = '尚未開始';
    renderTranscript('');
  }

  function renderTranscript(interim){
    if(!finalText && !interim){
      transcriptEl.classList.add('empty');
      transcriptEl.innerHTML = '';
      return;
    }
    transcriptEl.classList.remove('empty');
    const safeFinal = escapeHtml(finalText);
    const safeInterim = escapeHtml(interim);
    transcriptEl.innerHTML = safeFinal + (safeInterim ? '<span class="interim">' + safeInterim + '</span>' : '');
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  micBtn.addEventListener('click', function(){
    if(!recognition) return;
    if(listening){
      listening = false;
      recognition.stop();
    } else {
      listening = true;
      try{
        recognition.lang = currentLang;
        recognition.start();
      } catch(err){
        listening = false;
        showError('無法啟動語音辨識，請重新整理頁面再試一次。');
      }
    }
  });

  langPills.forEach(pill => {
    pill.addEventListener('click', function(){
      currentLang = pill.dataset.lang;
      langPills.forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      if(listening && recognition){
        // 換語言時重啟辨識引擎，onend 會因 listening 仍為 true 自動用新語言重啟
        recognition.stop();
      }
    });
  });

  copyBtn.addEventListener('click', function(){
    if(!finalText){ return; }
    navigator.clipboard.writeText(finalText).then(function(){
      const old = copyBtn.textContent;
      copyBtn.textContent = '已複製';
      setTimeout(() => { copyBtn.textContent = old; }, 1400);
    });
  });

  clearBtn.addEventListener('click', function(){
    finalText = '';
    renderTranscript('');
  });
})();
</script>

</body>
</html>
