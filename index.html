<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 即時語音字幕與雙向翻譯助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hcBg: '#000000',
                        hcCard: '#121212',
                        hcYellow: '#FFE600',
                    }
                }
            }
        }
    </script>
    <style>
        * {
            touch-action: manipulation;
        }
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.45);
            border-radius: 9999px;
        }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1.25); }
        }
        .mic-anim-1 { animation: wave 1.1s infinite ease-in-out 0s; }
        .mic-anim-2 { animation: wave 1.1s infinite ease-in-out 0.2s; }
        .mic-anim-3 { animation: wave 1.1s infinite ease-in-out 0.4s; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-hcBg text-gray-900 dark:text-white h-full flex flex-col justify-between transition-colors duration-200">

    <!-- Header Toolbar -->
    <header class="bg-white dark:bg-hcCard shadow-md p-3 sm:p-4 sticky top-0 z-20 flex flex-wrap items-center justify-between gap-2 border-b border-gray-200 dark:border-yellow-500/40">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 dark:from-hcYellow dark:to-amber-400 text-white dark:text-black flex items-center justify-center font-bold text-xl shadow-md">
                <i class="fa-solid fa-ear-listen"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-extrabold tracking-tight dark:text-hcYellow">AI 即時字幕與雙向翻譯</h1>
                <p class="text-xs text-gray-500 dark:text-gray-300">iOS Safari 專用 • 多發音人 • 中英即時互譯</p>
            </div>
        </div>

        <!-- Controls: Font, Contrast, Export, Clear -->
        <div class="flex items-center gap-2 flex-wrap">
            <!-- Font Size Adjuster -->
            <div class="flex items-center bg-gray-100 dark:bg-zinc-900 rounded-2xl p-1 border border-gray-300 dark:border-yellow-500/50">
                <button id="btnFontDec" class="w-10 h-10 flex items-center justify-center font-black rounded-xl hover:bg-gray-200 dark:hover:bg-zinc-800 text-base active:scale-95 transition dark:text-hcYellow" title="縮小字體">
                    A-
                </button>
                <span id="fontSizeDisplay" class="px-2 text-xs sm:text-sm font-extrabold min-w-[3.2rem] text-center dark:text-hcYellow">28px</span>
                <button id="btnFontInc" class="w-10 h-10 flex items-center justify-center font-black rounded-xl hover:bg-gray-200 dark:hover:bg-zinc-800 text-xl active:scale-95 transition dark:text-hcYellow" title="放大字體">
                    A+
                </button>
            </div>

            <!-- High Contrast Toggle -->
            <button id="btnHighContrast" class="h-11 px-3.5 rounded-2xl bg-amber-400 hover:bg-amber-500 text-black font-extrabold flex items-center gap-1.5 text-xs sm:text-sm shadow active:scale-95 transition">
                <i class="fa-solid fa-circle-half-stroke"></i>
                <span>高對比</span>
            </button>

            <!-- Export -->
            <button id="btnExport" class="h-11 px-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold flex items-center gap-1.5 text-xs sm:text-sm shadow active:scale-95 transition">
                <i class="fa-solid fa-file-export"></i>
                <span>匯出對話</span>
            </button>

            <!-- Clear -->
            <button id="btnClear" class="h-11 px-3.5 rounded-2xl bg-red-100 dark:bg-red-950/80 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800 hover:bg-red-200 font-bold text-xs sm:text-sm active:scale-95 transition" title="清除對話">
                <i class="fa-solid fa-trash-can"></i>
                <span class="hidden md:inline ml-1">清除對話</span>
            </button>
        </div>
    </header>

    <!-- Main Content Stream -->
    <main class="flex-1 overflow-y-auto p-3 sm:p-6 space-y-4 relative" id="transcriptContainer">
        
        <!-- Welcome / Onboarding Prompt -->
        <div id="welcomeBanner" class="bg-blue-50 dark:bg-zinc-900 border-2 border-blue-200 dark:border-hcYellow/60 p-4 sm:p-5 rounded-2xl shadow-sm text-sm text-blue-950 dark:text-hcYellow flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="flex items-start space-x-3">
                <i class="fa-solid fa-circle-info text-blue-600 dark:text-hcYellow text-2xl mt-0.5"></i>
                <div>
                    <strong class="font-extrabold text-base sm:text-lg block">使用說明：一鍵開始即時字幕與中英互譯</strong>
                    <p class="mt-1 text-xs sm:text-sm text-blue-900/90 dark:text-gray-200 leading-relaxed">
                        1. 點擊下方按鈕並允許 Safari 使用麥克風。<br>
                        2. 對話時可隨時點擊底部角色標籤切換發音人。<br>
                        3. 每則字幕右上角皆有<strong>「中 ⇄ 英 翻譯」</strong>大按鈕，點一下立即顯示雙語對照！
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-2 self-end sm:self-center">
                <button id="btnQuickStartBanner" class="px-4 py-2.5 rounded-xl bg-blue-600 dark:bg-hcYellow text-white dark:text-black font-extrabold text-xs sm:text-sm shadow active:scale-95 transition whitespace-nowrap">
                    立即開啟麥克風
                </button>
                <button onclick="document.getElementById('welcomeBanner').remove()" class="text-gray-400 hover:text-gray-600 dark:text-gray-400 p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Transcript Cards List -->
        <div id="transcriptList" class="space-y-4 pb-4"></div>

        <!-- Real-time Pending Stream (Interim) -->
        <div id="interimBox" class="hidden bg-yellow-100 dark:bg-zinc-900 border-2 border-dashed border-yellow-500 dark:border-hcYellow p-4 sm:p-5 rounded-2xl transition-all">
            <div class="flex items-center justify-between mb-2">
                <span id="interimSpeakerBadge" class="inline-flex items-center px-3 py-1 rounded-full text-xs sm:text-sm font-black bg-yellow-300 dark:bg-hcYellow text-yellow-950 dark:text-black">
                    <i class="fa-solid fa-microphone-lines mr-1.5 animate-pulse"></i> 正在收音辨識...
                </span>
                <div class="flex items-center space-x-1.5">
                    <span class="w-1.5 h-4 bg-yellow-600 dark:bg-hcYellow rounded-full mic-anim-1"></span>
                    <span class="w-1.5 h-4 bg-yellow-600 dark:bg-hcYellow rounded-full mic-anim-2"></span>
                    <span class="w-1.5 h-4 bg-yellow-600 dark:bg-hcYellow rounded-full mic-anim-3"></span>
                </div>
            </div>
            <p id="interimText" class="subtitle-text text-yellow-950 dark:text-hcYellow font-bold italic leading-relaxed" style="font-size: 28px;">
                ...
            </p>
        </div>

        <!-- Scroll Lock Floating Button -->
        <button id="btnScrollToBottom" class="hidden fixed bottom-40 right-5 z-30 bg-blue-600 dark:bg-hcYellow dark:text-black text-white px-4 py-3 rounded-full shadow-2xl hover:bg-blue-700 active:scale-95 transition flex items-center gap-2 font-extrabold text-sm">
            <i class="fa-solid fa-arrow-down text-base"></i>
            <span>回到最新字幕</span>
        </button>
    </main>

    <!-- Bottom Controls & Speaker Switcher -->
    <footer class="bg-white dark:bg-hcCard border-t border-gray-200 dark:border-yellow-500/40 shadow-2xl p-3 sm:p-4 z-20 space-y-3">
        
        <!-- Speaker Switcher Bar -->
        <div class="flex items-center justify-between gap-2">
            <span class="text-xs sm:text-sm font-black text-gray-600 dark:text-gray-300 whitespace-nowrap">
                <i class="fa-solid fa-user-tag mr-1"></i> 說話者:
            </span>
            
            <div id="speakerSelector" class="flex items-center gap-2 overflow-x-auto py-1 flex-1">
                <!-- JS Populated Buttons -->
            </div>

            <!-- Manage Speakers -->
            <button id="btnEditSpeakers" class="px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 text-xs sm:text-sm font-bold hover:bg-gray-100 dark:hover:bg-zinc-800 text-gray-700 dark:text-gray-200 whitespace-nowrap active:scale-95">
                <i class="fa-solid fa-user-pen mr-1"></i> 編輯角色
            </button>
        </div>

        <!-- Main Recording Trigger & Config -->
        <div class="flex items-center justify-between gap-2 sm:gap-4 pt-0.5">
            <!-- Auto Scroll Toggle -->
            <button id="btnAutoScroll" class="flex items-center space-x-1.5 text-xs sm:text-sm font-bold px-3 py-3 rounded-2xl bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 active:scale-95">
                <i class="fa-solid fa-lock text-emerald-500" id="scrollIcon"></i>
                <span id="scrollText" class="hidden sm:inline">自動捲動: 開</span>
            </button>

            <!-- Big Mic Button -->
            <button id="btnToggleRecord" class="flex-1 max-w-md mx-auto py-3.5 px-5 rounded-2xl bg-blue-600 dark:bg-hcYellow dark:text-black hover:bg-blue-700 text-white font-black text-base sm:text-lg shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95">
                <i class="fa-solid fa-microphone text-xl" id="micIcon"></i>
                <span id="micStatusText">點擊開始聽取字幕</span>
            </button>

            <!-- Language Selector -->
            <select id="langSelect" aria-label="辨識語言" class="bg-gray-100 dark:bg-zinc-900 border border-gray-300 dark:border-gray-700 rounded-2xl text-xs sm:text-sm font-bold px-3 py-3 text-gray-800 dark:text-hcYellow">
                <option value="zh-TW" selected>繁體中文 (台灣)</option>
                <option value="en-US">英文 (English)</option>
                <option value="zh-HK">廣東話 (香港)</option>
                <option value="ja-JP">日文 (日本語)</option>
            </select>
        </div>
    </footer>

    <!-- Speaker Edit Modal -->
    <div id="speakerModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-hcCard rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-gray-200 dark:border-yellow-500/40">
            <div class="flex justify-between items-center border-b pb-3 dark:border-gray-800">
                <h3 class="text-lg font-extrabold text-gray-900 dark:text-hcYellow">管理發音人角色</h3>
                <button id="btnCloseModal" class="text-gray-400 hover:text-gray-600 text-xl p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div id="modalSpeakerList" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>

            <div class="flex gap-2 pt-2">
                <input type="text" id="newSpeakerName" placeholder="新增角色 (例如: 護理師、阿公)" class="flex-1 border rounded-xl px-3 py-2.5 text-sm dark:bg-zinc-900 dark:border-gray-700 dark:text-white focus:outline-none focus:border-blue-500">
                <button id="btnAddSpeaker" class="bg-blue-600 text-white dark:bg-hcYellow dark:text-black px-4 py-2.5 rounded-xl font-extrabold text-sm hover:opacity-90">
                    新增
                </button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-hcCard rounded-3xl shadow-2xl max-w-lg w-full p-6 space-y-4 border border-gray-200 dark:border-yellow-500/40">
            <div class="flex justify-between items-center border-b pb-3 dark:border-gray-800">
                <h3 class="text-lg font-extrabold text-gray-900 dark:text-hcYellow">
                    <i class="fa-solid fa-file-export mr-2 text-emerald-500"></i>匯出對話逐字稿（含翻譯）
                </h3>
                <button id="btnCloseExportModal" class="text-gray-400 hover:text-gray-600 text-xl p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <textarea id="exportPreviewText" readonly class="w-full h-56 border rounded-2xl p-3.5 text-xs sm:text-sm font-mono bg-gray-50 dark:bg-black dark:text-hcYellow border-gray-300 dark:border-gray-700 focus:outline-none leading-relaxed"></textarea>

            <div class="flex gap-3 justify-end pt-2">
                <button id="btnCopyClipboard" class="flex-1 bg-gray-200 dark:bg-zinc-800 hover:bg-gray-300 text-gray-900 dark:text-white py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-copy"></i> 複製全部
                </button>
                <button id="btnDownloadTxt" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-download"></i> 下載 .txt 檔
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Modal (No browser confirm()) -->
    <div id="confirmModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-hcCard rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-5 border border-gray-200 dark:border-yellow-500/40 text-center">
            <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-950 text-red-600 dark:text-red-400 flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div>
                <h3 class="text-lg font-extrabold text-gray-900 dark:text-white">確定要清除所有對話嗎？</h3>
                <p class="text-sm text-gray-500 dark:text-gray-300 mt-1">清除後無法復原，建議先匯出保存紀錄。</p>
            </div>
            <div class="flex gap-3">
                <button id="btnCancelClear" class="flex-1 py-3 rounded-xl bg-gray-200 dark:bg-zinc-800 text-gray-800 dark:text-gray-200 font-bold text-sm">
                    取消
                </button>
                <button id="btnConfirmClear" class="flex-1 py-3 rounded-xl bg-red-600 text-white font-extrabold text-sm">
                    確定清除
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900 dark:bg-hcYellow dark:text-black text-white text-sm px-5 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 transition-opacity duration-300 font-extrabold whitespace-nowrap">
        <i class="fa-solid fa-circle-check text-green-400 dark:text-black"></i>
        <span id="toastMsg">通知訊息</span>
    </div>

    <!-- Main Logic -->
    <script>
        // Preset default speakers with high-contrast badges and borders
        let speakers = [
            { id: 'spk1', name: '說話者 A', color: 'bg-blue-600', lightBg: 'bg-white dark:bg-zinc-900', border: 'border-blue-500' },
            { id: 'spk2', name: '說話者 B', color: 'bg-emerald-600', lightBg: 'bg-emerald-50/60 dark:bg-zinc-900', border: 'border-emerald-500' },
            { id: 'spk3', name: '媽媽', color: 'bg-amber-600', lightBg: 'bg-amber-50/60 dark:bg-zinc-900', border: 'border-amber-500' },
            { id: 'spk4', name: '爸爸', color: 'bg-indigo-600', lightBg: 'bg-indigo-50/60 dark:bg-zinc-900', border: 'border-indigo-500' },
            { id: 'spk5', name: '醫生', color: 'bg-rose-600', lightBg: 'bg-rose-50/60 dark:bg-zinc-900', border: 'border-rose-500' }
        ];

        let activeSpeakerId = 'spk1';
        let currentFontSize = 28; // Elderly-friendly default
        let isRecording = false;
        let autoScroll = true;
        let isHighContrast = false;
        let recognition = null;
        let transcriptData = []; // { id, timestamp, speakerName, text, translatedText, targetLang, isTranslationVisible }

        // DOM Elements
        const transcriptContainer = document.getElementById('transcriptContainer');
        const transcriptList = document.getElementById('transcriptList');
        const interimBox = document.getElementById('interimBox');
        const interimText = document.getElementById('interimText');
        const interimSpeakerBadge = document.getElementById('interimSpeakerBadge');
        
        const btnToggleRecord = document.getElementById('btnToggleRecord');
        const btnQuickStartBanner = document.getElementById('btnQuickStartBanner');
        const micIcon = document.getElementById('micIcon');
        const micStatusText = document.getElementById('micStatusText');
        
        const fontSizeDisplay = document.getElementById('fontSizeDisplay');
        const btnFontDec = document.getElementById('btnFontDec');
        const btnFontInc = document.getElementById('btnFontInc');
        const btnHighContrast = document.getElementById('btnHighContrast');
        
        const btnAutoScroll = document.getElementById('btnAutoScroll');
        const scrollIcon = document.getElementById('scrollIcon');
        const scrollText = document.getElementById('scrollText');
        const btnScrollToBottom = document.getElementById('btnScrollToBottom');
        
        const speakerSelector = document.getElementById('speakerSelector');
        const langSelect = document.getElementById('langSelect');
        const btnClear = document.getElementById('btnClear');
        const btnExport = document.getElementById('btnExport');

        const speakerModal = document.getElementById('speakerModal');
        const btnEditSpeakers = document.getElementById('btnEditSpeakers');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const modalSpeakerList = document.getElementById('modalSpeakerList');
        const newSpeakerName = document.getElementById('newSpeakerName');
        const btnAddSpeaker = document.getElementById('btnAddSpeaker');

        const exportModal = document.getElementById('exportModal');
        const btnCloseExportModal = document.getElementById('btnCloseExportModal');
        const exportPreviewText = document.getElementById('exportPreviewText');
        const btnCopyClipboard = document.getElementById('btnCopyClipboard');
        const btnDownloadTxt = document.getElementById('btnDownloadTxt');

        const confirmModal = document.getElementById('confirmModal');
        const btnCancelClear = document.getElementById('btnCancelClear');
        const btnConfirmClear = document.getElementById('btnConfirmClear');

        window.addEventListener('DOMContentLoaded', () => {
            initSpeechRecognition();
            renderSpeakerButtons();
            updateFontSizeUI();

            btnFontDec.addEventListener('click', () => changeFontSize(-2));
            btnFontInc.addEventListener('click', () => changeFontSize(2));
            btnHighContrast.addEventListener('click', toggleHighContrast);
            btnToggleRecord.addEventListener('click', toggleRecording);
            if (btnQuickStartBanner) {
                btnQuickStartBanner.addEventListener('click', () => {
                    if (!isRecording) toggleRecording();
                });
            }
            
            btnAutoScroll.addEventListener('click', toggleAutoScroll);
            btnScrollToBottom.addEventListener('click', scrollToBottom);
            transcriptContainer.addEventListener('scroll', handleContainerScroll);

            btnClear.addEventListener('click', () => {
                if (transcriptData.length === 0) {
                    showToast('目前沒有可清除的對話');
                    return;
                }
                confirmModal.classList.remove('hidden');
            });
            btnCancelClear.addEventListener('click', () => confirmModal.classList.add('hidden'));
            btnConfirmClear.addEventListener('click', () => {
                transcriptData = [];
                transcriptList.innerHTML = '';
                confirmModal.classList.add('hidden');
                showToast('已清除所有對話紀錄');
            });

            btnExport.addEventListener('click', openExportModal);

            btnEditSpeakers.addEventListener('click', openSpeakerModal);
            btnCloseModal.addEventListener('click', () => speakerModal.classList.add('hidden'));
            btnAddSpeaker.addEventListener('click', addNewSpeaker);

            btnCloseExportModal.addEventListener('click', () => exportModal.classList.add('hidden'));
            btnCopyClipboard.addEventListener('click', copyToClipboard);
            btnDownloadTxt.addEventListener('click', downloadTxtFile);
        });

        // Initialize Web Speech API for iOS / iPadOS Safari
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showToast('此瀏覽器不支援語音辨識，請使用 iPhone/iPad 的 Safari 開啟。');
                btnToggleRecord.disabled = true;
                btnToggleRecord.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = langSelect.value;

            langSelect.addEventListener('change', () => {
                recognition.lang = langSelect.value;
                if (isRecording) {
                    try {
                        recognition.stop();
                    } catch (e) {}
                }
                showToast(`已切換辨識語言：${langSelect.options[langSelect.selectedIndex].text}`);
            });

            recognition.onstart = () => {
                isRecording = true;
                updateMicUI(true);
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    showToast('請在 Safari 設定中允許「麥克風」權限');
                    isRecording = false;
                    stopRecordingUI();
                } else if (event.error === 'no-speech') {
                    // Ignore silence timeout; onend will restart automatically
                }
            };

            // Safari auto-restart workaround on silence/timeout
            recognition.onend = () => {
                if (isRecording) {
                    setTimeout(() => {
                        if (isRecording) {
                            try {
                                recognition.start();
                            } catch (e) {}
                        }
                    }, 200);
                } else {
                    stopRecordingUI();
                }
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (interimTranscript.trim().length > 0) {
                    interimBox.classList.remove('hidden');
                    interimText.innerText = interimTranscript;
                    const activeSpk = getActiveSpeaker();
                    interimSpeakerBadge.innerHTML = `<i class="fa-solid fa-microphone-lines mr-1.5 animate-pulse"></i> ${escapeHtml(activeSpk.name)} 正在說話...`;
                    if (autoScroll) scrollToBottom();
                } else {
                    interimBox.classList.add('hidden');
                }

                if (finalTranscript.trim().length > 0) {
                    interimBox.classList.add('hidden');
                    addTranscriptCard(finalTranscript.trim());
                }
            };
        }

        function renderSpeakerButtons() {
            speakerSelector.innerHTML = '';
            speakers.forEach(spk => {
                const isActive = spk.id === activeSpeakerId;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-2.5 rounded-2xl font-black text-xs sm:text-sm transition-all flex items-center gap-1.5 whitespace-nowrap active:scale-95 ${
                    isActive 
                        ? `${spk.color} text-white shadow-md ring-2 ring-offset-1 ring-blue-500 dark:ring-hcYellow scale-105` 
                        : 'bg-gray-100 dark:bg-zinc-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-200'
                }`;
                btn.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-current"></span> ${escapeHtml(spk.name)}`;
                btn.onclick = () => selectSpeaker(spk.id);
                speakerSelector.appendChild(btn);
            });
        }

        function selectSpeaker(id) {
            activeSpeakerId = id;
            renderSpeakerButtons();
            showToast(`目前說話者：${getActiveSpeaker().name}`);
        }

        function getActiveSpeaker() {
            return speakers.find(s => s.id === activeSpeakerId) || speakers[0];
        }

        function toggleRecording() {
            if (!recognition) return;

            if (isRecording) {
                isRecording = false;
                try {
                    recognition.stop();
                } catch (e) {}
                stopRecordingUI();
                showToast('已暫停聽取字幕');
            } else {
                try {
                    recognition.lang = langSelect.value;
                    recognition.start();
                    isRecording = true;
                    updateMicUI(true);
                    showToast('已開啟麥克風，請開始說話');
                } catch (err) {
                    showToast('麥克風啟動中，請稍候再試');
                }
            }
        }

        function updateMicUI(recording) {
            if (recording) {
                btnToggleRecord.className = 'flex-1 max-w-md mx-auto py-3.5 px-5 rounded-2xl bg-red-600 text-white font-black text-base sm:text-lg shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95';
                micIcon.className = 'fa-solid fa-stop-circle text-xl animate-pulse';
                micStatusText.innerText = '正在收音中 (點擊停止)';
            } else {
                btnToggleRecord.className = 'flex-1 max-w-md mx-auto py-3.5 px-5 rounded-2xl bg-blue-600 dark:bg-hcYellow dark:text-black text-white font-black text-base sm:text-lg shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95';
                micIcon.className = 'fa-solid fa-microphone text-xl';
                micStatusText.innerText = '點擊開始聽取字幕';
            }
        }

        function stopRecordingUI() {
            isRecording = false;
            updateMicUI(false);
            interimBox.classList.add('hidden');
        }

        // Detect whether text is primarily Chinese or English
        function hasChinese(text) {
            return /[\u4e00-\u9fa5]/.test(text);
        }

        function addTranscriptCard(text) {
            const spk = getActiveSpeaker();
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const cardId = Date.now() + Math.floor(Math.random() * 1000);
            const isZh = hasChinese(text);
            const defaultTargetLang = isZh ? 'en' : 'zh-TW';
            const translateBtnLabel = isZh ? '中 ⇄ 英 翻譯 (譯成英文)' : '英 ⇄ 中 翻譯 (譯成中文)';

            const entry = {
                id: cardId,
                timestamp,
                speakerName: spk.name,
                text,
                translatedText: '',
                targetLang: defaultTargetLang,
                isTranslationVisible: false
            };

            transcriptData.push(entry);

            const card = document.createElement('div');
            card.id = `card-${cardId}`;
            card.className = `p-4 sm:p-5 rounded-2xl shadow-sm border-2 transition-all ${spk.lightBg} ${spk.border} border-l-8 relative`;
            card.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center px-3.5 py-1 rounded-full text-xs sm:text-sm font-black text-white ${spk.color}">
                            ${escapeHtml(spk.name)}
                        </span>
                        <span class="text-xs text-gray-500 dark:text-gray-300 font-mono">${timestamp}</span>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <!-- Prominent Bidirectional Translation Button -->
                        <button id="btn-trans-${cardId}" onclick="handleTranslateClick(${cardId})" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 dark:bg-hcYellow dark:hover:bg-amber-300 text-white dark:text-black font-extrabold text-xs sm:text-sm shadow flex items-center gap-1.5 active:scale-95 transition">
                            <i class="fa-solid fa-language text-base"></i>
                            <span id="btn-trans-label-${cardId}">${translateBtnLabel}</span>
                        </button>

                        <!-- Copy Single Bubble -->
                        <button onclick="copySingleCard(${cardId})" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-gray-200 hover:bg-gray-200 flex items-center justify-center active:scale-95 transition" title="複製此段文字">
                            <i class="fa-solid fa-copy"></i>
                        </button>

                        <!-- Delete Single Bubble -->
                        <button onclick="deleteCard(${cardId})" class="w-9 h-9 rounded-xl bg-gray-100 dark:bg-zinc-800 text-gray-500 dark:text-gray-300 hover:text-red-600 hover:bg-red-50 flex items-center justify-center active:scale-95 transition" title="刪除此段文字">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- Original Subtitle Text -->
                <p class="subtitle-text text-gray-900 dark:text-white font-bold leading-relaxed break-words" style="font-size: ${currentFontSize}px;">
                    ${escapeHtml(text)}
                </p>

                <!-- Translated Subtitle Container -->
                <div id="trans-box-${cardId}" class="hidden mt-3 pt-3 border-t-2 border-dashed border-indigo-200 dark:border-yellow-500/50">
                    <div class="flex items-center justify-between mb-1">
                        <span id="trans-tag-${cardId}" class="text-xs font-extrabold uppercase tracking-wider text-indigo-700 dark:text-hcYellow flex items-center gap-1">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> 即時翻譯結果
                        </span>
                        <button onclick="flipTranslationDirection(${cardId})" class="text-xs font-bold text-indigo-600 dark:text-hcYellow underline px-2 py-0.5 rounded hover:bg-indigo-50 dark:hover:bg-zinc-800">
                            切換中/英方向
                        </button>
                    </div>
                    <p id="trans-text-${cardId}" class="subtitle-text text-indigo-950 dark:text-hcYellow font-bold leading-relaxed break-words" style="font-size: ${currentFontSize}px;"></p>
                </div>
            `;

            transcriptList.appendChild(card);
            if (autoScroll) scrollToBottom();
        }

        // Handle Translation Button Click (Translate, Toggle Show/Hide)
        async function handleTranslateClick(cardId) {
            const entry = transcriptData.find(item => item.id === cardId);
            if (!entry) return;

            const btn = document.getElementById(`btn-trans-${cardId}`);
            const btnLabel = document.getElementById(`btn-trans-label-${cardId}`);
            const transBox = document.getElementById(`trans-box-${cardId}`);
            const transTextEl = document.getElementById(`trans-text-${cardId}`);
            const transTagEl = document.getElementById(`trans-tag-${cardId}`);

            // If already translated, toggle visibility smoothly
            if (entry.translatedText) {
                entry.isTranslationVisible = !entry.isTranslationVisible;
                if (entry.isTranslationVisible) {
                    transBox.classList.remove('hidden');
                    btnLabel.innerText = '隱藏翻譯';
                } else {
                    transBox.classList.add('hidden');
                    btnLabel.innerText = entry.targetLang === 'en' ? '顯示英文翻譯' : '顯示中文翻譯';
                }
                return;
            }

            // Perform translation
            btn.disabled = true;
            btnLabel.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> 翻譯中...`;

            try {
                const translated = await translateTextWithFallback(entry.text, entry.targetLang);
                entry.translatedText = translated;
                entry.isTranslationVisible = true;

                transTagEl.innerHTML = entry.targetLang === 'en'
                    ? `<i class="fa-solid fa-language"></i> 英文翻譯 (English)`
                    : `<i class="fa-solid fa-language"></i> 繁體中文翻譯`;
                transTextEl.innerText = translated;
                transTextEl.style.fontSize = `${currentFontSize}px`;
                transBox.classList.remove('hidden');
                btnLabel.innerText = '隱藏翻譯';

                if (autoScroll) scrollToBottom();
            } catch (err) {
                showToast('翻譯暫時無法連線，請稍後再試');
                btnLabel.innerText = entry.targetLang === 'en' ? '中 ⇄ 英 翻譯' : '英 ⇄ 中 翻譯';
            } finally {
                btn.disabled = false;
            }
        }

        // Flip translation direction (EN <-> ZH-TW) for a specific bubble
        async function flipTranslationDirection(cardId) {
            const entry = transcriptData.find(item => item.id === cardId);
            if (!entry) return;

            entry.targetLang = entry.targetLang === 'en' ? 'zh-TW' : 'en';
            entry.translatedText = '';
            await handleTranslateClick(cardId);
        }

        // Translate using Gemini API first, with reliable public fallback for standalone HTML usage
        async function translateTextWithFallback(sourceText, targetLang) {
            const targetDesc = targetLang === 'en' ? 'natural, clear English' : 'natural, clear Traditional Chinese (繁體中文)';
            const prompt = `Translate the following spoken dialogue into ${targetDesc}. Only output the translated text without quotes, explanations, or extra labels:\n\n${sourceText}`;

            // 1. Try Gemini API
            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const geminiText = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
                    if (geminiText) {
                        return geminiText;
                    }
                }
            } catch (e) {
                // Fall back silently if running standalone without Gemini proxy
            }

            // 2. Fallback 1: Google Translate public gtx endpoint
            try {
                const tl = targetLang === 'en' ? 'en' : 'zh-TW';
                const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(sourceText)}`;
                const res = await fetch(gtxUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && Array.isArray(data[0])) {
                        const joined = data[0].map(seg => seg[0]).join('');
                        if (joined.trim()) return joined.trim();
                    }
                }
            } catch (e) {}

            // 3. Fallback 2: MyMemory public translation API
            const langPair = targetLang === 'en' ? 'zh-TW|en' : 'en|zh-TW';
            const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(sourceText)}&langpair=${langPair}`;
            const mmRes = await fetch(mmUrl);
            if (!mmRes.ok) throw new Error('All translation providers failed');
            const mmData = await mmRes.json();
            if (mmData?.responseData?.translatedText) {
                return mmData.responseData.translatedText;
            }
            throw new Error('Empty translation');
        }

        function copySingleCard(id) {
            const entry = transcriptData.find(item => item.id === id);
            if (!entry) return;
            let content = `[${entry.timestamp}] ${entry.speakerName}: ${entry.text}`;
            if (entry.translatedText) {
                content += `\n翻譯: ${entry.translatedText}`;
            }
            copyTextToClipboardHelper(content);
            showToast('已複製此段對話');
        }

        function deleteCard(id) {
            transcriptData = transcriptData.filter(item => item.id !== id);
            const el = document.getElementById(`card-${id}`);
            if (el) el.remove();
            showToast('已刪除此段字幕');
        }

        function changeFontSize(delta) {
            currentFontSize = Math.min(Math.max(currentFontSize + delta, 18), 48);
            updateFontSizeUI();
        }

        function updateFontSizeUI() {
            fontSizeDisplay.innerText = `${currentFontSize}px`;
            const textElements = document.querySelectorAll('.subtitle-text');
            textElements.forEach(el => {
                el.style.fontSize = `${currentFontSize}px`;
            });
        }

        function toggleHighContrast() {
            isHighContrast = !isHighContrast;
            if (isHighContrast) {
                document.documentElement.classList.add('dark');
                showToast('已開啟黑底黃字高對比模式');
            } else {
                document.documentElement.classList.remove('dark');
                showToast('已切換回標準清晰模式');
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            scrollIcon.className = autoScroll ? 'fa-solid fa-lock text-emerald-500' : 'fa-solid fa-lock-open text-gray-400';
            scrollText.innerText = autoScroll ? '自動捲動: 開' : '自動捲動: 關';
            if (autoScroll) scrollToBottom();
        }

        function scrollToBottom() {
            transcriptContainer.scrollTo({
                top: transcriptContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function handleContainerScroll() {
            const isAtBottom = transcriptContainer.scrollHeight - transcriptContainer.scrollTop <= transcriptContainer.clientHeight + 90;
            if (isAtBottom) {
                btnScrollToBottom.classList.add('hidden');
            } else {
                btnScrollToBottom.classList.remove('hidden');
            }
        }

        function openSpeakerModal() {
            modalSpeakerList.innerHTML = '';
            speakers.forEach((spk) => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 p-2.5 rounded-xl bg-gray-100 dark:bg-zinc-900';
                row.innerHTML = `
                    <div class="flex items-center gap-2.5 flex-1">
                        <span class="w-4 h-4 rounded-full ${spk.color}"></span>
                        <input type="text" value="${escapeHtml(spk.name)}" onchange="updateSpeakerName('${spk.id}', this.value)" class="flex-1 bg-transparent border-b border-gray-300 dark:border-gray-700 px-1 py-1 text-sm dark:text-white font-bold focus:outline-none focus:border-blue-500">
                    </div>
                    ${speakers.length > 1 ? `<button onclick="deleteSpeaker('${spk.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>` : ''}
                `;
                modalSpeakerList.appendChild(row);
            });
            speakerModal.classList.remove('hidden');
        }

        function updateSpeakerName(id, newName) {
            if (!newName.trim()) return;
            const spk = speakers.find(s => s.id === id);
            if (spk) {
                spk.name = newName.trim();
                renderSpeakerButtons();
            }
        }

        function addNewSpeaker() {
            const name = newSpeakerName.value.trim();
            if (!name) return;

            const palette = [
                { color: 'bg-purple-600', lightBg: 'bg-purple-50/60 dark:bg-zinc-900', border: 'border-purple-500' },
                { color: 'bg-teal-600', lightBg: 'bg-teal-50/60 dark:bg-zinc-900', border: 'border-teal-500' },
                { color: 'bg-orange-600', lightBg: 'bg-orange-50/60 dark:bg-zinc-900', border: 'border-orange-500' }
            ];
            const colorSet = palette[speakers.length % palette.length];

            const newSpk = {
                id: 'spk_' + Date.now(),
                name,
                color: colorSet.color,
                lightBg: colorSet.lightBg,
                border: colorSet.border
            };

            speakers.push(newSpk);
            newSpeakerName.value = '';
            renderSpeakerButtons();
            openSpeakerModal();
        }

        function deleteSpeaker(id) {
            speakers = speakers.filter(s => s.id !== id);
            if (activeSpeakerId === id) {
                activeSpeakerId = speakers[0].id;
            }
            renderSpeakerButtons();
            openSpeakerModal();
        }

        function openExportModal() {
            if (transcriptData.length === 0) {
                showToast('目前尚無字幕紀錄可匯出');
                return;
            }
            const text = transcriptData.map(item => {
                let line = `[${item.timestamp}] ${item.speakerName}: ${item.text}`;
                if (item.translatedText) {
                    line += `\n    ↳ 翻譯: ${item.translatedText}`;
                }
                return line;
            }).join('\n\n');

            exportPreviewText.value = text;
            exportModal.classList.remove('hidden');
        }

        function copyTextToClipboardHelper(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        function copyToClipboard() {
            const text = exportPreviewText.value;
            if (!text) return;
            copyTextToClipboardHelper(text);
            showToast('已複製全部對話與翻譯！');
        }

        function downloadTxtFile() {
            const text = exportPreviewText.value;
            if (!text) return;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `語音字幕與翻譯紀錄_${new Date().toISOString().slice(0, 10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已開始下載逐字稿檔案');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('hidden');
            toast.style.opacity = '1';
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
